# The platform lists by name the kinds of apps.cozystack.io that a tenant admin may
# write, and a kind that is not in the list is written by super-admin alone. This adds
# the kind to the admin role. Reading it needs nothing here: view, and every role that
# includes view, may read every kind of the group.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cozy:site-router:admin
  labels:
    rbac.cozystack.io/aggregate-to-tenant-admin: "true"
rules:
- apiGroups: ["apps.cozystack.io"]
  resources:
  - siterouters
  verbs:
  - create
  - update
  - patch
  - delete
