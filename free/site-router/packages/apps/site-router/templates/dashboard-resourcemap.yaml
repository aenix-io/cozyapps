---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-resourcemap
  labels:
    app.kubernetes.io/name: site-router
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.cozystack.io/type: dashboard-resourcemap
data:
  resources: |
    - apiVersion: siterouter.aenix.io/v1alpha1
      kind: SiteRouter
      name: {{ include "site-router.name" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-dashboard-resources
  labels:
    app.kubernetes.io/name: site-router
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - {{ .Release.Name }}-resourcemap
  verbs: ["get", "list", "watch"]
- apiGroups:
  - siterouter.aenix.io
  resources:
  - siterouters
  resourceNames:
  - {{ include "site-router.name" . }}
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-dashboard-resources
  labels:
    app.kubernetes.io/name: site-router
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
subjects:
{{ include "cozy-lib.rbac.subjectsForTenantAndAccessLevel" (list "use" .Release.Namespace) }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-dashboard-resources
  apiGroup: rbac.authorization.k8s.io
