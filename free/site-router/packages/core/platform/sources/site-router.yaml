apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: aenix.site-router
  annotations:
    # The platform gives every release of a package its cluster values (_cluster and
    # more), and the schema of the chart of the operator refuses a key it does not
    # know. The operator needs none of them: what it needs of the cluster is given
    # as values of the package, see README.md.
    operator.cozystack.io/skip-cozystack-values: "true"
spec:
  sourceRef:
    kind: OCIRepository
    name: site-router-packages
    namespace: cozy-system
    path: /
  variants:
    # The gateway on a cluster whose network is kube-ovn.
    - name: default
      dependsOn:
        - cozystack.networking
        - cozystack.kubevirt
        - cozystack.kubevirt-cdi
        # It ships the ApplicationDefinition CRD that the -rd component renders.
        - cozystack.cozystack-engine
      libraries:
        - name: cozy-lib
          path: library/cozy-lib
      components:
        - name: site-router-operator
          path: system/site-router-operator
          valuesFiles:
            - values.yaml
            - values-cozystack.yaml
          install:
            namespace: cozy-site-router
            releaseName: site-router-operator
        # The namespace is the one the admission policy of the connector names, and
        # it is not to be changed here without changing the manifests.
        - name: site-router-kube-ovn-connector
          path: system/site-router-kube-ovn-connector
          install:
            namespace: site-router-kube-ovn-connector
            releaseName: site-router-kube-ovn-connector
            dependsOn:
              - site-router-operator
        - name: site-router
          path: apps/site-router
          libraries: ["cozy-lib"]
        - name: site-router-rd
          path: system/site-router-rd
          install:
            namespace: cozy-system
            releaseName: site-router-rd
            dependsOn:
              - site-router-operator
              - site-router-kube-ovn-connector
