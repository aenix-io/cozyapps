name: site-router

# A change to the catalog is validated and rendered. A tag site-router/vX.Y.Z
# publishes the catalog as an OCI artifact and signs it.
on:
  pull_request:
    paths:
      - "free/site-router/**"
      - ".github/workflows/site-router.yml"
  push:
    tags:
      - "site-router/v*"

permissions: {}

env:
  # The cozypkg of the Cozystack release the catalog is written for.
  COZYPKG_VERSION: v1.7.0-rc.1
  HELM_VERSION: v4.3.0
  ARTIFACT: ghcr.io/aenix-io/cozyapps/site-router

jobs:
  validate:
    permissions:
      contents: read
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # The archive is checked against the checksums the release publishes.
      - name: Install cozypkg
        run: |
          dir=$(mktemp -d)
          gh release download "$COZYPKG_VERSION" --repo cozystack/cozystack \
            --pattern 'cozypkg-linux-amd64.tar.gz' --pattern 'cozypkg-checksums.txt' --dir "$dir"
          (cd "$dir" && sha256sum --check --ignore-missing cozypkg-checksums.txt)
          tar -xzf "$dir/cozypkg-linux-amd64.tar.gz" -C "$dir"
          sudo install -m 0755 "$dir/cozypkg" /usr/local/bin/cozypkg
          cozypkg --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate the repository
        run: make -C free/site-router validate

      - name: Render the charts
        run: make -C free/site-router render

  publish:
    if: startsWith(github.ref, 'refs/tags/site-router/v')
    needs: validate
    permissions:
      contents: read
      packages: write
      # Keyless signing: the OIDC token of this workflow is the identity the
      # signature is issued to.
      id-token: write
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Take the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#site-router/}
          if ! [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a release tag: site-router/vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install cozypkg
        run: |
          dir=$(mktemp -d)
          gh release download "$COZYPKG_VERSION" --repo cozystack/cozystack \
            --pattern 'cozypkg-linux-amd64.tar.gz' --pattern 'cozypkg-checksums.txt' --dir "$dir"
          (cd "$dir" && sha256sum --check --ignore-missing cozypkg-checksums.txt)
          tar -xzf "$dir/cozypkg-linux-amd64.tar.gz" -C "$dir"
          sudo install -m 0755 "$dir/cozypkg" /usr/local/bin/cozypkg
        env:
          GH_TOKEN: ${{ github.token }}

      # cozypkg pushes the artifact by the flux CLI.
      - name: Install flux
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the catalog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cozypkg push "oci://${ARTIFACT}:${VERSION}" --path free/site-router \
            --source "https://github.com/${GITHUB_REPOSITORY}" \
            --revision "${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}"

      # The digest is signed, not the tag, which can be moved. Whoever connects the
      # catalog follows the tag, so a tag that is moved is what the signature is not
      # for: tags of a release are not moved.
      - name: Sign the artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          digest=$(crane digest "${ARTIFACT}:${VERSION}")
          cosign sign --yes "${ARTIFACT}@${digest}"
